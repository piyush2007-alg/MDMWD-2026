<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Grade Calculator</title>
  <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-6">

  <main class="w-full max-w-lg bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 overflow-hidden">
    
    <!-- Card Header -->
    <header class="bg-gradient-to-r from-indigo-600 to-violet-600 px-6 py-8 text-white">
      <h1 class="text-2xl font-bold tracking-tight">Grade Calculator</h1>
      <p class="text-indigo-100 text-sm mt-1">Enter student assessment scores below</p>
    </header>

    <div class="p-6 sm:p-8 space-y-6">
    
      <section class="space-y-4">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Student Profile</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
            <input 
              type="text" 
              id="name" 
              placeholder="e.g., Alex Johnson"
              class="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-slate-400 text-sm"
            >
          </div>
          <div>
            <label for="roll" class="block text-sm font-medium text-slate-700 mb-1">Roll Number</label>
            <input 
              type="text" 
              id="roll" 
              placeholder="e.g., CS-2026-42"
              class="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all placeholder:text-slate-400 text-sm"
            >
          </div>
        </div>
      </section>

      <!-- Marks Section -->
      <section class="space-y-4">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Assessment Scores (out of 100)</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label for="lab1" class="block text-xs font-medium text-slate-600 mb-1">Lab Practical 1</label>
            <input 
              type="number" 
              id="lab1" 
              min="0" 
              max="100" 
              placeholder="0-100"
              class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm"
            >
          </div>
          <div>
            <label for="lab2" class="block text-xs font-medium text-slate-600 mb-1">Lab Practical 2</label>
            <input 
              type="number" 
              id="lab2" 
              min="0" 
              max="100" 
              placeholder="0-100"
              class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm"
            >
          </div>
          <div>
            <label for="viva" class="block text-xs font-medium text-slate-600 mb-1">Viva Oral</label>
            <input 
              type="number" 
              id="viva" 
              min="0" 
              max="100" 
              placeholder="0-100"
              class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm"
            >
          </div>
        </div>
      </section>

      <!-- Action Button -->
      <button 
        type="button"
        onclick="calculateGrade()"
        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium rounded-lg shadow-md shadow-indigo-200 transition-colors cursor-pointer"
      >
        Calculate Grade
      </button>

      <!-- Result Card -->
      <div id="resultCard" class="hidden mt-6 p-5 rounded-xl border transition-all duration-300">
        <!-- Rendered dynamically -->
      </div>

    </div>
  </main>

  <script>
    function calculateGrade() {
      const name = document.getElementById("name").value.trim() || "Unknown Student";
      const roll = document.getElementById("roll").value.trim() || "N/A";
      const lab1 = Number(document.getElementById("lab1").value) || 0;
      const lab2 = Number(document.getElementById("lab2").value) || 0;
      const viva = Number(document.getElementById("viva").value) || 0;

      const total = lab1 + lab2 + viva;
      const percentage = total / 3;
      let grade = "F";
      let statusColor = "bg-rose-50 border-rose-200 text-rose-800";
      let badgeColor = "bg-rose-100 text-rose-700";

      if (percentage >= 90) {
        grade = "A+";
        statusColor = "bg-emerald-50 border-emerald-200 text-emerald-950";
        badgeColor = "bg-emerald-100 text-emerald-800";
      } else if (percentage >= 80) {
        grade = "A";
        statusColor = "bg-emerald-50 border-emerald-200 text-emerald-900";
        badgeColor = "bg-emerald-100 text-emerald-700";
      } else if (percentage >= 70) {
        grade = "B";
        statusColor = "bg-blue-50 border-blue-200 text-blue-950";
        badgeColor = "bg-blue-100 text-blue-700";
      } else if (percentage >= 60) {
        grade = "C";
        statusColor = "bg-amber-50 border-amber-200 text-amber-950";
        badgeColor = "bg-amber-100 text-amber-800";
      } else if (percentage >= 50) {
        grade = "D";
        statusColor = "bg-orange-50 border-orange-200 text-orange-950";
        badgeColor = "bg-orange-100 text-orange-800";
      }

      const resultContainer = document.getElementById("resultCard");
      resultContainer.className = `p-5 rounded-xl border ${statusColor} space-y-3`;

      resultContainer.innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-200/50 pb-3">
          <div>
            <h3 class="font-bold text-base text-slate-800">${name}</h3>
            <p class="text-xs text-slate-500">Roll: ${roll}</p>
          </div>
          <span class="inline-flex items-center justify-center px-3 py-1 text-sm font-bold rounded-full ${badgeColor}">
            Grade ${grade}
          </span>
        </div>
        <div class="grid grid-cols-2 gap-3 text-sm pt-1">
          <div class="bg-white/80 p-2.5 rounded-lg border border-slate-100">
            <span class="text-xs text-slate-500 block">Total Score</span>
            <span class="font-semibold text-slate-800">${total} / 300</span>
          </div>
          <div class="bg-white/80 p-2.5 rounded-lg border border-slate-100">
            <span class="text-xs text-slate-500 block">Percentage</span>
            <span class="font-semibold text-slate-800">${percentage.toFixed(2)}%</span>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
